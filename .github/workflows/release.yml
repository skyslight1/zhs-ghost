name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: 构建 Windows exe
    runs-on: windows-latest

    # windows runner 的控制台默认是 cp1252，脚本里的中文日志会直接炸
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 单元自测（先证明源码是对的）
        run: python tests/run_tests.py

      - name: GUI 冒烟测试
        run: python tests/gui_smoke.py

      - name: 构建全部四个 exe
        run: python packaging/build.py release

      - name: 检查产物
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          $expected = @(
            "dist/zhs-ghost-gui.exe",
            "dist/zhs-ghost-lite-gui.exe",
            "dist/zhs-ghost.exe",
            "dist/zhs-ghost-lite.exe"
          )
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) { throw "缺少产物 $f" }
            if ((Get-Item $f).Length -lt 1MB) { throw "$f 体积异常，可能没打进去依赖" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: zhs-ghost-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zhs-ghost-gui.exe
            dist/zhs-ghost-lite-gui.exe
            dist/zhs-ghost.exe
            dist/zhs-ghost-lite.exe
            dist/*.zip
          generate_release_notes: true
          draft: false
