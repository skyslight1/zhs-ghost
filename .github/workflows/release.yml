name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    name: 构建 Windows exe
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 单元自测（先证明源码是对的）
        run: python tests/run_tests.py

      - name: 构建完整版 exe
        run: python packaging/build.py full

      - name: 构建精简版 exe
        run: python packaging/build.py lite

      - name: 检查产物
        shell: pwsh
        run: |
          Get-ChildItem dist | Format-Table Name, Length
          foreach ($f in @("dist/zhs-ghost.exe", "dist/zhs-ghost-lite.exe")) {
            if (-not (Test-Path $f)) { throw "缺少产物 $f" }
            if ((Get-Item $f).Length -lt 1MB) { throw "$f 体积异常，可能没打进去依赖" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: zhs-ghost-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 14

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/zhs-ghost.exe
            dist/zhs-ghost-lite.exe
            dist/*.zip
          generate_release_notes: true
          draft: false
