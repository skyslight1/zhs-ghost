name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    name: selftest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只装自测真正需要的依赖。playwright / ddddocr 是可选的重依赖，
      # 自测用假时钟跑完整学习循环，不需要它们 —— 所以 CI 能跑得很快。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome PyYAML loguru

      - name: Byte-compile all sources
        run: python -m compileall -q zhsgo main.py tests

      - name: Run self test
        run: python tests/run_tests.py

      - name: Dry-run CLI self check
        run: |
          cp config.example.yaml config.yaml
          python main.py --dry-run

  gui:
    # Tk 窗口在 Linux runner 上不好搞，单独放 Windows
    name: GUI 冒烟（Windows）
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome PyYAML loguru

      # Pillow 是核心依赖（二维码渲染必须），GUI 作业要装齐，否则测的不是真实环境
      - name: Install GUI test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome PyYAML loguru Pillow

      - name: GUI 冒烟测试
        run: python tests/gui_smoke.py

      - name: 入口与打包脚本语法检查
        run: python -m py_compile gui.py main.py packaging/build.py zhsgo/gui/window.py
